 
name: Build USELESS AI Portable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore USELESS-AI.csproj

      - name: Publish portable app
        run: dotnet publish USELESS-AI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: USELESS-AI-Portable-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/
